<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cineville Hamburg - Referral Program</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Averta';
            src: local('Averta Bold'), local('Averta-Bold'), url('https://fonts.cdnfonts.com/s/29136/AvertaBold.woff') format('woff');
            font-weight: 900;
            font-style: normal;
        }
        @font-face {
            font-family: 'Averta';
            src: local('Averta Regular'), local('Averta-Regular'), url('https://fonts.cdnfonts.com/s/29136/AvertaRegular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
        }

        * {
            font-family: 'Averta', sans-serif !important;
        }

        body {
            background-color: #F8F2E7;
            color: #000000;
            overflow-x: hidden;
        }

        .cineville-btn {
            background-color: #000000;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .cineville-btn:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        .cineville-card {
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px #000000;
        }

        /* --- STYLES ET ANIMATIONS DE LA JAUGE --- */
        .gauge-smooth {
            transition: width 1.8s cubic-bezier(0.16, 1, 0.3, 1), left 1.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Effet visuel hachuré sur la barre noire */
        .gauge-bar-pattern {
            background-image: linear-gradient(
                45deg, 
                rgba(255, 255, 255, 0.15) 25%, 
                transparent 25%, 
                transparent 50%, 
                rgba(255, 255, 255, 0.15) 50%, 
                rgba(255, 255, 255, 0.15) 75%, 
                transparent 75%, 
                transparent
            );
            background-size: 1rem 1rem;
            animation: moveStripes 2s linear infinite;
        }

        @keyframes moveStripes {
            0% { background-position: 0 0; }
            100% { background-position: 1rem 0; }
        }

        .score-lock {
            animation: popLock 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popLock {
            0% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Cascade d'images de cartes Cineville */
        .card-cascade-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-card-img {
            position: absolute;
            top: -200px;
            width: 110px;
            height: auto;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.15));
            opacity: 0;
            animation: floatDown linear infinite;
        }

        .card-1 { left: 6%;  animation-duration: 10s; animation-delay: 0s;   transform: rotate(-15deg); }
        .card-2 { left: 22%; animation-duration: 9s;  animation-delay: 1.5s; transform: rotate(20deg); }
        .card-3 { left: 45%; animation-duration: 11s; animation-delay: 4s;   transform: rotate(-8deg); }
        .card-4 { left: 68%; animation-duration: 9.5s; animation-delay: 2.5s; transform: rotate(18deg); }
        .card-5 { left: 82%; animation-duration: 10s; animation-delay: 6s;   transform: rotate(-25deg); }
        .card-6 { left: 92%; animation-duration: 12s; animation-delay: 3.5s; transform: rotate(12deg); }

        @keyframes floatDown {
            0% { top: -200px; opacity: 0; }
            5% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% { top: 105vh; opacity: 0; }
        }

        /* Popcorn Animation */
        #popcorn-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .popcorn-particle {
            position: absolute;
            top: -60px;
            user-select: none;
            pointer-events: none;
            animation: popcornFall linear forwards;
        }

        @keyframes popcornFall {
            0% { top: -60px; opacity: 1; transform: translateX(0) rotate(0deg); }
            100% { top: 105vh; opacity: 0.9; transform: translateX(var(--drift)) rotate(var(--rot)); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 relative">

    <div id="popcorn-container"></div>

    <!-- Fond animé cartes Cineville -->
    <div class="card-cascade-container">
        <img src="Images/Carte Cineville.png" class="floating-card-img card-1" alt="Cineville Card">
        <img src="Images/Carte Cineville.png" class="floating-card-img card-2" alt="Cineville Card">
        <img src="Images/Carte Cineville.png" class="floating-card-img card-3" alt="Cineville Card">
        <img src="Images/Carte Cineville.png" class="floating-card-img card-4" alt="Cineville Card">
        <img src="Images/Carte Cineville.png" class="floating-card-img card-5" alt="Cineville Card">
        <img src="Images/Carte Cineville.png" class="floating-card-img card-6" alt="Cineville Card">
    </div>

    <!-- Carte Principale -->
    <div class="bg-[#F7DEBB] p-8 md:p-10 rounded-2xl cineville-card max-w-lg w-full relative z-10 flex flex-col justify-between">
        
        <div>
            <!-- Grand Score / Titre Animé -->
            <div class="text-center mb-4">
                <h1 id="user-percentile-title" class="text-4xl md:text-5xl font-black leading-tight text-[#3D0B00] transition-transform">
                    How about one year of free cinema?
                </h1>
            </div>

            <!-- Sous-titre (Caché sur le tableau de bord) -->
            <p id="main-subtitle" class="text-[#3D0B00] text-center text-lg mb-8 font-medium">
                Check if you will receive the gift!
            </p>

            <!-- Formulaire de saisie -->
            <div id="login-section">
                <label class="block text-sm font-bold text-black mb-2">
                    Cineville account number
                </label>
                <input type="text" id="cineville-id" placeholder="e.g. CINE001" class="w-full px-4 py-3 border-2 border-black rounded-xl focus:outline-none focus:ring-2 focus:ring-black mb-4 font-bold text-lg bg-white">
                
                <button onclick="fetchDashboard()" class="w-full cineville-btn font-bold text-lg py-3 rounded-xl">
                    View my ranking
                </button>
                
                <p id="error-message" class="text-red-600 font-bold text-sm mt-3 hidden text-center"></p>
            </div>

            <!-- Zone Tableau de bord & Jauge Animée -->
            <div id="dashboard-section" class="hidden">

                <!-- Cadre Ranking progress -->
                <div id="progress-card" class="p-5 rounded-xl border-2 border-black shadow-[2px_2px_0px_#000] mb-6 transition-colors">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-black">Ranking progress</span>
                        <span id="score-text" class="text-sm font-black text-black">Top 100%</span>
                    </div>

                    <div class="flex justify-between text-[10px] font-bold mb-1.5 text-black uppercase tracking-wider">
                        <span>Top 100%</span>
                        <span>Top 0% (#1)</span>
                    </div>

                    <!-- Rail de la Jauge de Progression -->
                    <div class="relative w-full h-9 bg-white rounded-xl border-2 border-black p-0.5 overflow-hidden flex items-center shadow-inner">
                        <!-- Barre de progression hachurée -->
                        <div id="progress-bar" class="h-full bg-black gauge-bar-pattern w-0 gauge-smooth rounded-lg relative"></div>

                        <!-- Curseur indicateur stylisé -->
                        <div id="gauge-marker" class="absolute top-0 bottom-0 w-3 bg-white border-2 border-black shadow-[2px_0_5px_rgba(0,0,0,0.3)] z-30 gauge-smooth -ml-1.5 rounded-sm" style="left: 0%;"></div>
                    </div>
                </div>
                
                <!-- Message de Statut -->
                <div id="status-message" class="text-center p-5 rounded-xl border-2 border-black font-medium text-base mb-6 transition-colors"></div>

                <!-- Carte Parrainages -->
                <div id="stat-card" class="p-6 border-2 border-black rounded-xl text-center mb-6 transition-colors">
                    <p class="text-5xl font-black text-black" id="stat-referrals">--</p>
                    <p class="text-xs font-bold text-gray-800 mt-2" id="referrals-label">Friend(s) referred</p>
                </div>

                <!-- Code Unique -->
                <div id="code-card" class="border-2 border-black p-4 rounded-xl mb-2 text-center transition-colors">
                    <p class="text-xs font-bold text-gray-800 mb-2">Your unique referral code</p>
                    <div class="flex items-center justify-center gap-3">
                        <span id="share-code" class="text-2xl font-black text-black px-4 py-2 rounded-lg border-2 border-black tracking-widest transition-colors">
                            ------
                        </span>
                        <button onclick="copyCode()" class="text-sm font-bold bg-black text-white px-4 py-3 rounded-lg hover:opacity-80">
                            Copy
                        </button>
                    </div>
                </div>

                <button onclick="logout()" class="w-full mt-6 text-black text-sm font-bold underline hover:opacity-75">
                    Switch account
                </button>
            </div>
        </div>

        <!-- Décompte temps restant (Compact & Placé en bas) -->
        <div class="mt-8 pt-4 text-center text-[#3D0B00] border-t border-[#3D0B00]/20">
            <div class="flex items-center justify-center gap-2 sm:gap-3">
                
                <!-- Days -->
                <div class="flex flex-col items-center min-w-[36px]">
                    <span id="timer-days" class="text-xl font-black leading-none">--</span>
                    <span class="text-[10px] font-medium opacity-80 mt-0.5">Days</span>
                </div>

                <div class="h-4 w-[1px] bg-[#3D0B00] opacity-30"></div>

                <!-- Hours -->
                <div class="flex flex-col items-center min-w-[36px]">
                    <span id="timer-hours" class="text-xl font-black leading-none">--</span>
                    <span class="text-[10px] font-medium opacity-80 mt-0.5">Hours</span>
                </div>

                <div class="h-4 w-[1px] bg-[#3D0B00] opacity-30"></div>

                <!-- Minutes -->
                <div class="flex flex-col items-center min-w-[36px]">
                    <span id="timer-minutes" class="text-xl font-black leading-none">--</span>
                    <span class="text-[10px] font-medium opacity-80 mt-0.5">Minutes</span>
                </div>

                <div class="h-4 w-[1px] bg-[#3D0B00] opacity-30"></div>

                <!-- Seconds -->
                <div class="flex flex-col items-center min-w-[36px]">
                    <span id="timer-seconds" class="text-xl font-black leading-none">--</span>
                    <span class="text-[10px] font-medium opacity-80 mt-0.5">Seconds</span>
                </div>

            </div>
            <p class="text-[10px] font-bold mt-1.5 text-[#3D0B00] opacity-90">Remaining before Dec 1, 2026</p>
        </div>

    </div>

    <script>
        const targetDate = new Date("2026-12-01T00:00:00Z").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById('timer-days').innerText = "0";
                document.getElementById('timer-hours').innerText = "0";
                document.getElementById('timer-minutes').innerText = "0";
                document.getElementById('timer-seconds').innerText = "0";
                return;
            }

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('timer-days').innerText = days;
            document.getElementById('timer-hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('timer-minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('timer-seconds').innerText = String(seconds).padStart(2, '0');
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Animation fluide de la jauge et du compteur
        function animateGaugeTo(targetPercentile, onComplete) {
            const progressBar = document.getElementById('progress-bar');
            const gaugeMarker = document.getElementById('gauge-marker');
            const titleEl = document.getElementById('user-percentile-title');
            const scoreTextEl = document.getElementById('score-text');

            titleEl.classList.remove('score-lock');

            const targetProgress = 100 - targetPercentile; 

            // Déclenchement de l'animation CSS fluide
            requestAnimationFrame(() => {
                progressBar.style.width = `${targetProgress}%`;
                gaugeMarker.style.left = `${Math.min(targetProgress, 98)}%`;
            });

            // Compteur numérique synchronisé
            const duration = 1800; // 1.8s
            const startTime = performance.now();

            function updateCounter(currentTime) {
                const elapsed = currentTime - startTime;
                const progressRatio = Math.min(elapsed / duration, 1);
                
                // Formule de ralentissement fluide (easeOutCubic)
                const easedProgress = 1 - Math.pow(1 - progressRatio, 3);
                const currentProgress = easedProgress * targetProgress;
                const currentPercentile = Math.round(100 - currentProgress);

                titleEl.innerText = `Top ${currentPercentile}%`;
                scoreTextEl.innerText = `Top ${currentPercentile}%`;

                if (progressRatio < 1) {
                    requestAnimationFrame(updateCounter);
                } else {
                    titleEl.innerText = `Top ${targetPercentile}%`;
                    scoreTextEl.innerText = `Top ${targetPercentile}%`;
                    titleEl.classList.add('score-lock');

                    if (onComplete) onComplete();
                }
            }

            requestAnimationFrame(updateCounter);
        }

        async function fetchDashboard() {
            const userId = document.getElementById('cineville-id').value.trim();
            const errorEl = document.getElementById('error-message');
            
            if (!userId) {
                errorEl.innerText = "Please enter a valid Cineville account number";
                errorEl.classList.remove('hidden');
                return;
            }

            // Simulation : CINE001 = Top 5%, autre = Top 35%
            const isTop5 = (userId.toUpperCase() === "CINE001");
            const targetPercentile = isTop5 ? 5 : 35;
            const referrals = isTop5 ? 42 : 1;
            const code = "CINE-" + userId.toUpperCase();

            errorEl.classList.add('hidden');
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('main-subtitle').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');

            // Réinitialisation jauge
            const progressBar = document.getElementById('progress-bar');
            const gaugeMarker = document.getElementById('gauge-marker');
            progressBar.style.width = '0%';
            gaugeMarker.style.left = '0%';

            document.getElementById('share-code').innerText = code;
            document.getElementById('stat-referrals').innerText = referrals;

            // Gestion dynamique du texte Friend / Friends
            document.getElementById('referrals-label').innerText = referrals === 1 ? "Friend referred" : "Friends referred";

            const progressCardEl = document.getElementById('progress-card');
            const statusEl = document.getElementById('status-message');
            const statCardEl = document.getElementById('stat-card');
            const codeCardEl = document.getElementById('code-card');
            const shareCodeEl = document.getElementById('share-code');

            // Couleurs de thème : Vert (Top 20% ou mieux) vs Jaune (Hors Top 20%)
            const greenBg = "bg-[#C0E8C1]";
            const yellowBg = "bg-[#FDE68A]";

            animateGaugeTo(targetPercentile, () => {
                if (targetPercentile <= 20) {
                    // Application des styles Verts
                    progressCardEl.className = `p-5 rounded-xl border-2 border-black shadow-[2px_2px_0px_#000] mb-6 transition-colors ${greenBg}`;
                    statusEl.className = `text-center p-5 rounded-xl border-2 border-black font-medium text-base ${greenBg} text-black mb-6 transition-colors`;
                    statusEl.innerHTML = "<strong>Congratulations!</strong> You're in the Top 20%. Keep your position until Dec 1 to get your yearly free subscription!";
                    
                    statCardEl.className = `p-6 border-2 border-black rounded-xl ${greenBg} text-center mb-6 transition-colors`;
                    codeCardEl.className = `${greenBg} border-2 border-black p-4 rounded-xl mb-2 text-center transition-colors`;
                    shareCodeEl.className = `text-2xl font-black text-black ${greenBg} px-4 py-2 rounded-lg border-2 border-black tracking-widest transition-colors`;

                    if (isTop5) {
                        triggerPopcorn();
                    }
                } else {
                    // Application des styles Jaunes
                    progressCardEl.className = `p-5 rounded-xl border-2 border-black shadow-[2px_2px_0px_#000] mb-6 transition-colors ${yellowBg}`;
                    statusEl.className = `text-center p-5 rounded-xl border-2 border-black font-medium text-base ${yellowBg} text-black mb-6 transition-colors`;
                    statusEl.innerHTML = `You are currently in the <strong>Top ${targetPercentile}%</strong>. Refer more friends to climb up the ranking before Dec 1, 2026!`;
                    
                    statCardEl.className = `p-6 border-2 border-black rounded-xl ${yellowBg} text-center mb-6 transition-colors`;
                    codeCardEl.className = `${yellowBg} border-2 border-black p-4 rounded-xl mb-2 text-center transition-colors`;
                    shareCodeEl.className = `text-2xl font-black text-black ${yellowBg} px-4 py-2 rounded-lg border-2 border-black tracking-widest transition-colors`;
                }
            });
        }

        function copyCode() {
            const code = document.getElementById('share-code').innerText;
            navigator.clipboard.writeText(code);
            alert(`Referral code ${code} copied!`);
        }

        function logout() {
            document.getElementById('cineville-id').value = '';
            document.getElementById('user-percentile-title').innerText = "How about one year of free cinema?";
            document.getElementById('score-text').innerText = "Top 100%";
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('gauge-marker').style.left = '0%';
            document.getElementById('stat-referrals').innerText = "--";
            document.getElementById('referrals-label').innerText = "Friend(s) referred";
            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('main-subtitle').classList.remove('hidden');
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('popcorn-container').innerHTML = '';
        }

        function triggerPopcorn() {
            const container = document.getElementById('popcorn-container');
            container.innerHTML = '';

            for (let i = 0; i < 60; i++) {
                const popcorn = document.createElement('img');
                popcorn.src = 'Images/Popcorn.png';
                popcorn.className = 'popcorn-particle';
                popcorn.style.left = `${Math.random() * 100}vw`;
                popcorn.style.width = `${Math.random() * 30 + 30}px`;
                popcorn.style.animationDuration = `${Math.random() * 2 + 2}s`;
                popcorn.style.animationDelay = `${Math.random() * 1}s`;
                popcorn.style.setProperty('--drift', `${(Math.random() - 0.5) * 200}px`);
                popcorn.style.setProperty('--rot', `${Math.random() * 360}deg`);

                container.appendChild(popcorn);
            }

            setTimeout(() => { container.innerHTML = ''; }, 6000);
        }
    </script>
</body>
</html>
